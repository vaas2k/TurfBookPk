worker_processes auto;

events {
    worker_connections 1024;
}

http {
    upstream turfbookpk_api {
        least_conn;
        server api:5000 max_fails=1 fail_timeout=5s;
        server api-replica:5000 max_fails=1 fail_timeout=5s;
        keepalive 32;
    }

    server {
        listen 8080;
        server_name _;

        # Metrics remain private and are scraped directly by Prometheus.
        location = /api/internal/metrics {
            return 404;
        }

        location /api/ {
            proxy_pass http://turfbookpk_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 3s;
            proxy_read_timeout 35s;
            proxy_send_timeout 35s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;

            # Rehearsal-only evidence of which API handled the request.
            add_header X-TurfBook-Rehearsal-Upstream $upstream_addr always;
        }
    }
}
